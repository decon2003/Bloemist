# Nightly Postgres backup to Cloudflare R2 (free tiers only).
#
# Neon's free plan keeps only a short restore window, so this is the copy that
# survives a bad migration, an accidental delete or losing the Neon account.
#
# Repository secrets required (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL           Neon connection string (the direct one, not -pooler)
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#
# Retention: add a lifecycle rule on the bucket in Cloudflare that deletes
# objects under "backups/" after 60 days.
#
# Restore (into an empty database):
#   pg_restore --no-owner --no-privileges -d "<target url>" bloemist-YYYY-MM-DD.dump
name: Database backup

on:
  schedule:
    - cron: '0 19 * * *' # 02:00 Vietnam time
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          FILE="bloemist-$(date -u +%F).dump"
          # pg_dump must be at least the server's major version; 17 covers Neon's current versions.
          docker run --rm -e DATABASE_URL postgres:17 \
            sh -c 'pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges' > "$FILE"
          # Refuse to upload an empty or truncated dump.
          test "$(stat -c %s "$FILE")" -gt 1024
          docker run --rm -v "$PWD:/w" postgres:17 pg_restore --list "/w/$FILE" > /dev/null
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          ls -lh "$FILE"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp "$FILE" "s3://${{ secrets.R2_BUCKET }}/backups/$FILE" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
